<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="dist/style.css">
        <title>Test Page</title>
    </head>
    <body>
        <header class="header">
            <img
                src="img/logo_no_bg.png"
                alt="Logo"
                class="header__logo">

                <div class="header__shortcuts">
                    <p>Preview</p>
                    <p>About us</p>
                    <p>Contacts</p>
                </div>
        </header>

        <div id="demo-modal" class="modal">
            <div class="modal__content">
                <div class="modal__content__flex">
                    <div class="carousel">
                        <input checked type=radio name="slider" id="slide1" />
                        <input type=radio name="slider" id="slide2" />
                        <input type=radio name="slider" id="slide3" />
                        <input type=radio name="slider" id="slide4" />
                        <input type=radio name="slider" id="slide5" />
                    
                        <div class="carousel__slider-wrapper">
                        <div class=carousel__inner>
                            <article>
                                <img 
                                    class="carousel__inner__img"    
                                    src="img/wheel/1.jpg" />
                            </article>
                            <article>
                                <img 
                                    class="carousel__inner__img"
                                    src="img/wheel/2.jpg" />
                            </article>
                            <article>
                                <img 
                                    class="carousel__inner__img"
                                    src="img/wheel/3.jpg" />
                            </article>
                            <article>
                                <img 
                                    class="carousel__inner__img"
                                    src="img/wheel/4.jpg" />
                            </article>
                            <article>
                                <img 
                                    class="carousel__inner__img"
                                    src="img/wheel/5.jpg" />
                            </article>
                        </div>
                        <!-- .inner -->
                        </div>
                        <!-- .slider-wrapper -->
                    
                        <div class="carousel__slider-prev-next-control">
                        <label for=slide1></label>
                        <label for=slide2></label>
                        <label for=slide3></label>
                        <label for=slide4></label>
                        <label for=slide5></label>
                        </div>
                        <!-- .slider-prev-next-control -->
                    
                        <div class="carousel__slider-dot-control">
                        <label for=slide1></label>
                        <label for=slide2></label>
                        <label for=slide3></label>
                        <label for=slide4></label>
                        <label for=slide5></label>
                        </div>
                        <!-- .slider-dot-control -->
                    </div>
                    
                    <div class="modal__content__column">
                        <h1 class=modal__content__title>Карбоновый руль</h1>
                        <div class="modal__content__description">
                            Карбоновый аэродинамический руль-приставка Model-1 
                        </div>
                        <button class="modal__content__price">200$</button>
                    </div>

                </div>

                <!--<div class="modal__footer">
                    Цена
                </div>-->
                <a href="#" class="modal__close">&times;</a>
            </div>
        </div>

        <main class="showcase">
            <div style="height: 15rem;"></div>

            <div class="showcase__container">
                <img 
                    src="img/fixed_bicycle_no_bg.webp" 
                    alt="Bicycle" 
                    class="showcase__image">

                <button class="showcase__point_ring"></button>
                <button class="showcase__point_aero"></button>
                <button class="showcase__point_adapter"></button>
                <button class="showcase__point_wheel"></button>
                
                <div id="wheel_descr" class="showcase__description_wheel" >
                    <img 
                        src="img/wheel_presentation_no-bg.webp"
                        alt="Carbon wheel"
                        class="showcase__description_wheel__img">
                    <b class="showcase__description_wheel_phrase">Carbon wheel</b>
                    <em>100$</em>
                    <a class="showcae__description_wheel__button" href="#demo-modal">
                        More
                    </a>
                </div>

               
        </main>
        <footer class="footer">

        </footer>
        <script src="app/js/script.js"></script>
    </body>
</html>
